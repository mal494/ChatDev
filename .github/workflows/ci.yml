name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-compile:
    name: Backend syntax check (compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: |
          python -m compileall -q \
            -x '(frontend|node_modules|\.git|\.agents)' \
            chatdev_agent check diagnostics entity functions mcp_example runtime schema_registry server tools utils workflow yaml_instance \
            server_main.py run.py

  frontend-build:
    name: Frontend build (npm ci + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
