graph:
  id: pygame_game_factory_streamlined
  description: Streamlined two-phase workflow to generate cool, playable Pygame games with visual polish.
  log_level: INFO
  is_majority_voting: false
  nodes:
    - id: Final_Game_Executor
      type: python
      config:
        interpreter: C:\ChatDev-main\ChatDev-main\.venv\Scripts\python.exe
        args: []
        env: {}
        timeout_seconds: 120
        encoding: utf-8
      description: ''
      context_window: 0
      log_output: true

    - id: manager
      type: agent
      config:
        name: "Manager"
        provider: "openai"
        role: |-
          You are a manager in the AI driven game development process...
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling: []
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 0
      log_output: true

    - id: Planner
      type: agent
      config:
        name: "Planner"
        provider: "openai"
        role: |-
          # Role
          You are a Technical Planner...
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling: []
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true

    - id: Game Designer
      type: agent
      config:
        name: "Game Designer"
        provider: "openai"
        role: |-
          # Role
          You are a Creative Game Designer...
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling: []
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true

    - id: Core_Developer
      type: agent
      config:
        name: "Core Developer"
        provider: "openai"
        role: |-
          Implement Phase 1 pygame game...
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              auto_load: true
              tools:
                - name: install_python_packages
                - name: save_file
                - name: describe_available_files
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 6
      log_output: true

    - id: Polish_Developer
      type: agent
      config:
        name: "Polish Developer"
        provider: "openai"
        role: |-
          You are a PROFESSIONAL GAME ARTIST...
